# Minimal Suricata config for container usage. For production, tune capture, output, and logging.
%YAML 1.1
---
vars:
  address-groups: []
  port-groups: []

default-log-dir: /var/log/suricata

outputs:
  - fast:
      enabled: yes
      filename: fast.log
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types: [http, alert]
