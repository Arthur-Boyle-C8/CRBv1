groups:
  - name: crb-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{code=~"5.."}[2m]) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on log-generator"
          description: "More than 5% of requests are returning 5xx over the last 2 minutes."
